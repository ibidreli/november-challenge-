services:
  db:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-november_challenge}
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-november_challenge}
      STRAVA_CLIENT_ID: "${STRAVA_CLIENT_ID}"
      STRAVA_CLIENT_SECRET: "${STRAVA_CLIENT_SECRET}"
      STRAVA_REDIRECT_URI: "${STRAVA_REDIRECT_URI:-http://localhost:8000/auth/callback}"
      CHALLENGE_YEAR: "${CHALLENGE_YEAR:-2026}"
      CHALLENGE_MONTH: "${CHALLENGE_MONTH:-11}"
      COOKIE_SECURE: "0"
      STRAVA_WEBHOOK_VERIFY_TOKEN: "${STRAVA_WEBHOOK_VERIFY_TOKEN:-}"
      STRAVA_WEBHOOK_SUBSCRIPTION_ID: "${STRAVA_WEBHOOK_SUBSCRIPTION_ID:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      CUSTOM_DOMAIN: "${CUSTOM_DOMAIN:-}"
      ENABLE_BACKGROUND_SYNC: "${ENABLE_BACKGROUND_SYNC:-1}"
      ENABLE_DEBUG_ROUTES: "${ENABLE_DEBUG_ROUTES:-0}"
      REQUIRE_POSTGRES: "1"
    ports:
      - "8000:8000"
    restart: always
volumes:
  db_data:
