<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>November Challenge</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body { font-family: Arial, sans-serif; text-align:center; padding:40px; color:#444; }
    </style>
  </head>
  <body>
    <h1>Weiterleitung…</h1>
    <p>Wenn dein Hosting keine direkte SPA‑Rewrite unterstützt, klicke bitte <a href="/">hier</a>.</p>
    <script>
      // try to load index.html via fetch fallback (for some static hosts)
      (async function(){
        try {
          const resp = await fetch('/index.html');
          if (resp.ok) {
            const html = await resp.text();
            document.open();
            document.write(html);
            document.close();
          }
        } catch(e){}
      })();
    </script>
  </body>
</html>
